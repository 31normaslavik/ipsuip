name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '19 6 * * 1'

permissions:
  contents: read

jobs:
  scorecard:
    # Scorecard использует публичный GraphQL API и не работает с приватным репозиторием.
    # Для приватного репо с доступом задайте variable SCORECARD_ENABLED=true.
    if: github.event.repository.visibility == 'public' || vars.SCORECARD_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Точная версия: плавающего тега v2 у action больше нет.
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Публикация результатов в OSSF API доступна только публичным репозиториям.
          publish_results: ${{ github.event.repository.visibility == 'public' }}
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
